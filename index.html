<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Malla Universitaria</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .asignatura {
      border: 1px solid #aaa;
      border-radius: 10px;
      padding: 10px;
      margin: 5px;
      display: inline-block;
      cursor: pointer;
      background-color: #f0f0f0;
    }
    .asignatura:hover {
      background-color: #d9f4ff;
    }
    .info {
      display: none;
      margin-top: 5px;
      font-size: 0.9em;
      color: #444;
    }
  </style>
</head>
<body>

  <h1>Malla Interactiva - Obstetricia</h1>

  <div class="asignatura" onclick="toggleInfo('bioetica')">
    Bioética
    <div id="bioetica" class="info">
      Créditos: 4<br>
      Requisito: Ninguno<br>
      Semestre: 2°<br>
      Contenidos: Principios éticos en salud, autonomía, beneficencia.
    </div>
  </div>

  <div class="asignatura" onclick="toggleInfo('fisiologia')">
    Fisiología
    <div id="fisiologia" class="info">
      Créditos: 5<br>
      Requisito: Anatomía<br>
      Semestre: 2°<br>
      Contenidos: Funcionamiento del cuerpo humano.
    </div>
  </div>

  <script>
    function toggleInfo(id) {
      const info = document.getElementById(id);
      info.style.display = info.style.display === 'block' ? 'none' : 'block';
    }
  </script>

</body>
</html>
